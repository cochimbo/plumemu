# Runs the test ROMs people sent in plumsg's issues (sega/tools/test-roms/roms.txt) on the
# branch and on the base it is compared with, and says which ones draw something
# different. Started by hand from the Actions tab (Run workflow: choose the branch
# to try and the base), and on pull requests that change the list or the scripts.
name: Test ROMs

on:
  workflow_dispatch:
    inputs:
      base:
        description: Branch, tag or commit to compare with
        default: main
  pull_request:
    paths:
      - sega/tools/test-roms/**
      - .github/workflows/test-roms.yml

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check out the base
        run: |
          base="${{ github.event.pull_request.base.sha || inputs.base || 'main' }}"
          git rev-parse --verify --quiet "$base^{commit}" >/dev/null || base="origin/$base"
          echo "Base: $base ($(git rev-parse --short "$base"))"
          git worktree add --detach ../base "$base"
          # A base from before plumsg came into plumemu (sega/) is compared with plumsg as
          # it was then, at the commit it came in from.
          if [ ! -f ../base/sega/CMakeLists.txt ]; then
            echo "::notice::The base has no sega/; comparing with plumsg 6e2285f instead."
            git worktree remove --force ../base
            git clone -q https://github.com/cochimbo/plumsg ../base
            git -C ../base checkout -q 6e2285f
          fi
      - name: Build both
        run: |
          for src in . ../base; do
            if [ -f "$src/sega/CMakeLists.txt" ]; then
              cmake -S "$src" -B "$src/build" -DCMAKE_BUILD_TYPE=Release -DPLUM_BUILD_FRONTEND=OFF -DPLUM_BUILD_NINTENDO=OFF
            else
              cmake -S "$src" -B "$src/build" -DCMAKE_BUILD_TYPE=Release -DPLUMSG_BUILD_FRONTEND=OFF
            fi
            cmake --build "$src/build" --parallel --target plumsg-headless
          done
      - name: Run the test ROMs
        run: |
          # The change's list and scripts drive both runs, so both run the same ROMs.
          base_headless=$(ls ../base/build/sega/plumsg-headless ../base/build/plumsg-headless 2>/dev/null | head -1)
          sega/tools/test-roms/run.sh "$base_headless" roms results/base
          sega/tools/test-roms/run.sh build/sega/plumsg-headless roms results/change
      - name: Compare
        run: python3 sega/tools/test-roms/compare.py results/base results/change results/report.html "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: test-rom-report
          path: results
      - uses: actions/upload-artifact@v4
        with:
          name: test-roms
          path: roms
          retention-days: 3
