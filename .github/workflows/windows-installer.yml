# The Windows installer and the Linux AppImage of plumsg (sega/) and plumnin (nintendo/).
# Each program is released with its own tags: plumsg-v1.2.0 publishes plumsg,
# plumnin-v0.4.0-alpha publishes plumnin. Pushes to main and pull requests build both.
name: Windows installer

on:
  push:
    branches: [main]
    tags: ['plumsg-v*', 'plumnin-v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag to create and publish as a release (plumsg-v1.2.0 or plumnin-v0.4.0-alpha). Leave empty to only build.'
        required: false
        default: ''

permissions:
  contents: write

env:
  SDL2_VERSION: 2.30.9
  GENERALUSER_COMMIT: main
  PDFIUM_BUILD: '8138'
  # Set when a plumsg-v* or plumnin-v* tag is pushed, or when the workflow is run by hand
  # with a release_tag.
  RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/plum') && github.ref_name || inputs.release_tag }}

jobs:
  # Which programs this run builds: the one a release tag names, else both.
  apps:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        shell: bash
        run: |
          sega='{"app":"sega","name":"plumsg","prefix":"PLUMSG","only":"-DPLUM_BUILD_NINTENDO=OFF"}'
          nintendo='{"app":"nintendo","name":"plumnin","prefix":"PLUMNIN","only":"-DPLUM_BUILD_SEGA=OFF"}'
          case "$RELEASE_TAG" in
            plumsg-v*) list="[$sega]" ;;
            plumnin-v*) list="[$nintendo]" ;;
            "") list="[$sega,$nintendo]" ;;
            *) echo "::error::release_tag must look like plumsg-v1.2.3 or plumnin-v1.2.3"; exit 1 ;;
          esac
          echo "matrix={\"include\":$list}" >> "$GITHUB_OUTPUT"

  installer:
    name: installer (${{ matrix.name }})
    needs: apps
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.apps.outputs.matrix) }}
    env:
      APP_EXE: ${{ matrix.name }}.exe
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Only documentation changed?
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: bash tools/ci/needs-build.sh


      - name: Download SDL2 (MSVC development package)
        if: steps.changes.outputs.build == 'true'
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\sdl2.zip"
          Invoke-WebRequest "https://github.com/libsdl-org/SDL/releases/download/release-$env:SDL2_VERSION/SDL2-devel-$env:SDL2_VERSION-VC.zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\sdl2"
          "SDL2_ROOT=$env:RUNNER_TEMP\sdl2\SDL2-$env:SDL2_VERSION" >> $env:GITHUB_ENV

      - name: Compute version
        if: steps.changes.outputs.build == 'true'
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG) {
            $tag = "${{ matrix.name }}-v"
            if (-not $env:RELEASE_TAG.StartsWith($tag) -or $env:RELEASE_TAG.Substring($tag.Length) -notmatch '^\d') {
              Write-Host "::error::release_tag must look like ${tag}1.2.3"; exit 1
            }
            $v = $env:RELEASE_TAG.Substring($tag.Length)
          }
          else { $v = "0.0.0-dev.$env:GITHUB_RUN_NUMBER" }
          "APP_VERSION=$v" >> $env:GITHUB_ENV

      - name: Build emulator (Release)
        if: steps.changes.outputs.build == 'true'
        shell: pwsh
        env:
          # ScreenScraper's developer account; empty if the secrets are not set.
          SS_DEVID: ${{ secrets.SCREENSCRAPER_DEVID }}
          SS_DEVPASSWORD: ${{ secrets.SCREENSCRAPER_DEVPASSWORD }}
        run: |
          # A release shows its own version in About and crash reports; other builds, git describe.
          $p = "${{ matrix.prefix }}"
          $version = if ($env:RELEASE_TAG) { "-D${p}_VERSION=$env:APP_VERSION" } else { "-D${p}_VERSION=" }
          cmake -S . -B build -A x64 ${{ matrix.only }} "-DCMAKE_PREFIX_PATH=$env:SDL2_ROOT/cmake" "-DSDL2_DIR=$env:SDL2_ROOT/cmake" $version `
            "-D${p}_SCREENSCRAPER_DEVID=$env:SS_DEVID" "-D${p}_SCREENSCRAPER_DEVPASSWORD=$env:SS_DEVPASSWORD"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build --config Release --parallel
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Stage files for the installer
        if: steps.changes.outputs.build == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $exes = Get-ChildItem build -Recurse -Filter *.exe | Where-Object { $_.FullName -notmatch '\\CMakeFiles\\' }
          $exe = $exes | Where-Object Name -eq $env:APP_EXE | Select-Object -First 1
          if (-not $exe) {
            if ($exes.Count -ne 1) {
              Write-Host "::error::Could not find $env:APP_EXE in build/. Found: $($exes.Name -join ', ')"
              exit 1
            }
            $exe = $exes[0]
            Write-Host "::warning::$env:APP_EXE not found; packaging $($exe.Name) instead."
            "APP_EXE=$($exe.Name)" >> $env:GITHUB_ENV
          }
          Copy-Item $exe.FullName dist\
          # Prefer an SDL2.dll produced by the build (e.g. FetchContent); else use the downloaded one.
          $dll = Get-ChildItem build -Recurse -Filter SDL2.dll | Select-Object -First 1
          if ($dll) { Copy-Item $dll.FullName dist\ } else { Copy-Item "$env:SDL2_ROOT\lib\x64\SDL2.dll" dist\ }
          if (Test-Path "$env:SDL2_ROOT\README-SDL.txt") { Copy-Item "$env:SDL2_ROOT\README-SDL.txt" dist\ }
          # The SoundFont for the Roland sound and the synthesizer: GeneralUser GS by
          # S. Christian Collins, free to use and redistribute (its license goes with it).
          New-Item -ItemType Directory -Force dist\soundfonts | Out-Null
          $gu = "https://raw.githubusercontent.com/mrbumpy409/GeneralUser-GS/$env:GENERALUSER_COMMIT"
          Invoke-WebRequest "$gu/GeneralUser-GS.sf2" -OutFile dist\soundfonts\GeneralUser-GS.sf2
          Invoke-WebRequest "$gu/documentation/LICENSE.txt" -OutFile dist\soundfonts\GeneralUser-GS-LICENSE.txt
          # The 3D view's console models, with the credits their licenses ask for.
          Copy-Item -Recurse ${{ matrix.app }}\assets\models dist\models
          # PDFium, to read the games' manuals in the 3D view (BSD and Apache licenses: its
          # LICENSE goes with it). Pinned to one build of bblanchon/pdfium-binaries.
          $pdf = "$env:RUNNER_TEMP\pdfium"
          New-Item -ItemType Directory -Force $pdf | Out-Null
          Invoke-WebRequest "https://github.com/bblanchon/pdfium-binaries/releases/download/chromium/$env:PDFIUM_BUILD/pdfium-win-x64.tgz" -OutFile "$pdf\pdfium.tgz"
          tar -xzf "$pdf\pdfium.tgz" -C $pdf
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item "$pdf\bin\pdfium.dll" dist\
          New-Item -ItemType Directory -Force dist\pdfium-licenses | Out-Null
          Copy-Item "$pdf\LICENSE" dist\pdfium-licenses\pdfium-LICENSE.txt
          Copy-Item "$pdf\licenses\*" dist\pdfium-licenses\
          # shine, Exportar a MP3's encoder (LGPL 2): its license goes with it.
          Copy-Item build\_deps\shine-src\COPYING dist\shine-LICENSE.txt
          Get-ChildItem dist

      - name: Build installer (Inno Setup)
        if: steps.changes.outputs.build == 'true'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          & $iscc "/DAppVersion=$env:APP_VERSION" "/DAppExeName=$env:APP_EXE" "/DSourceDir=$env:GITHUB_WORKSPACE\dist" "/DOutputDir=$env:GITHUB_WORKSPACE\dist-installer" ${{ matrix.app }}\installer\${{ matrix.name }}.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Upload installer
        if: steps.changes.outputs.build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-windows-installer
          path: dist-installer/*.exe

      - name: Attach installer to release
        if: steps.changes.outputs.build == 'true' && env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          # Only used when the tag does not exist yet (manual run): tag the built commit.
          target_commitish: ${{ github.sha }}
          files: dist-installer/*.exe
          # Tags with a suffix (plumnin-v0.4.0-alpha, plumsg-v1.3.0-rc1) are published as prereleases.
          prerelease: ${{ contains(env.RELEASE_TAG, '-alpha') || contains(env.RELEASE_TAG, '-beta') || contains(env.RELEASE_TAG, '-rc') }}
          generate_release_notes: true

  # The Linux build: one AppImage that runs on most desktops and on the Steam Deck without
  # Proton. Built on the oldest supported Ubuntu so it runs with older glibc versions too.
  appimage:
    name: appimage (${{ matrix.name }})
    needs: apps
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.apps.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Only documentation changed?
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: bash tools/ci/needs-build.sh

      - name: Install SDL2's build dependencies
        if: steps.changes.outputs.build == 'true'
        # SDL2 itself is built from source (the same version as on Windows) and linked in
        # statically; these are the headers of what it talks to: X11, Wayland, the sound
        # servers, the pads (udev) and the input methods. It loads them when it runs.
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev \
            libxfixes-dev libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev libegl-dev libgl-dev \
            libgles-dev libpulse-dev libasound2-dev libpipewire-0.3-dev libudev-dev libdbus-1-dev libibus-1.0-dev \
            libfuse2 file xvfb

      - name: Compute version
        if: steps.changes.outputs.build == 'true'
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            tag="${{ matrix.name }}-v"
            [[ "$RELEASE_TAG" =~ ^${tag}[0-9] ]] || { echo "::error::release_tag must look like ${tag}1.2.3"; exit 1; }
            echo "APP_VERSION=${RELEASE_TAG#$tag}" >> "$GITHUB_ENV"
          else
            echo "APP_VERSION=0.0.0-dev.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          fi

      - name: Build emulator (Release)
        if: steps.changes.outputs.build == 'true'
        env:
          SS_DEVID: ${{ secrets.SCREENSCRAPER_DEVID }}
          SS_DEVPASSWORD: ${{ secrets.SCREENSCRAPER_DEVPASSWORD }}
        run: |
          version=""
          if [ -n "$RELEASE_TAG" ]; then version="$APP_VERSION"; fi
          p=${{ matrix.prefix }}
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.only }} -DPLUM_BUILD_TESTS=OFF -D${p}_VERSION="$version" \
            -D${p}_SCREENSCRAPER_DEVID="$SS_DEVID" -D${p}_SCREENSCRAPER_DEVPASSWORD="$SS_DEVPASSWORD"
          cmake --build build --parallel --target ${{ matrix.name }}

      - name: Build AppImage
        if: steps.changes.outputs.build == 'true'
        run: bash ${{ matrix.app }}/tools/linux/make-appimage.sh build/${{ matrix.app }} "$APP_VERSION" dist-appimage

      - name: Check that it starts
        if: steps.changes.outputs.build == 'true'
        # A few seconds in a virtual screen: it must open its window without a missing library.
        run: |
          app=$(ls dist-appimage/*.AppImage)
          chmod +x "$app"
          set +e
          HOME=$RUNNER_TEMP/home timeout 10 xvfb-run -a -s "-screen 0 1280x720x24" "$app"
          rc=$?
          set -e
          if [ "$rc" -ne 124 ]; then echo "::error::${{ matrix.name }} exited with $rc before 10 seconds"; exit 1; fi

      - name: Upload AppImage
        if: steps.changes.outputs.build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-linux-appimage
          path: dist-appimage/*.AppImage

  # After the Windows job, which creates the release when the run is a manual one, so
  # the two do not both try to create it.
  appimage-release:
    needs: [installer, appimage]
    if: needs.appimage.result == 'success' && (startsWith(github.ref, 'refs/tags/plum') || inputs.release_tag != '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          # A release is always of one program, the one its tag names.
          name: ${{ startsWith(env.RELEASE_TAG, 'plumsg-') && 'plumsg' || 'plumnin' }}-linux-appimage
          path: dist-appimage
      - name: Attach AppImage to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          files: dist-appimage/*.AppImage
          prerelease: ${{ contains(env.RELEASE_TAG, '-alpha') || contains(env.RELEASE_TAG, '-beta') || contains(env.RELEASE_TAG, '-rc') }}
